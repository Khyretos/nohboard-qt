name: windows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows
    defaults:
      run:
        shell: powershell
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        id: configure
        run: |
          bash -lc "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release"

      - name: Build
        id: build
        run: |
          bash -lc "cmake --build build"

      - name: Install
        run: & C:\msys64\usr\bin\bash.exe -lc "cmake --install build --prefix \"\$PWD/dist\""

      - name: Clean-PATH launch check
        run: |
          $env:PATH = "C:\Windows\System32"
          $p = Start-Process -FilePath "dist\bin\NohBoard.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            Write-Host "Exit code: $($p.ExitCode)"
            exit 1
          } else {
            Stop-Process -Id $p.Id -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: NohBoard-windows
          path: dist/
